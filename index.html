<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Bus Stop - Triple V</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#08070b;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    touch-action:manipulation;
}

.game{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#08070b;
}


/* =====================================================
   GENERAL SCREENS
===================================================== */

.screen{
    position:absolute;
    inset:0;

    display:none;

    width:100%;
    height:100%;

    overflow:hidden;
}

.screen.active{
    display:flex;
}


/* =====================================================
   BACKGROUND
===================================================== */

.background{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:0;
}

.background-dark{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.65),
            rgba(18,14,25,.72),
            rgba(0,0,0,.72)
        );

    z-index:1;
}


/* =====================================================
   LOGO INTRO
===================================================== */

#logoScreen{
    align-items:center;
    justify-content:center;
}

.logo-holder{
    position:relative;
    z-index:2;

    width:75vw;
    max-width:430px;

    animation:
        logoAppear
        .8s
        ease-out
        forwards;
}

.logo{
    display:block;

    width:100%;
    height:auto;

    object-fit:contain;

    filter:
        drop-shadow(0 0 20px rgba(112,70,255,.35));
}

@keyframes logoAppear{

    0%{
        opacity:0;
        transform:scale(.65);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }

}


/* =====================================================
   NAME SCREEN
===================================================== */

#nameScreen{
    align-items:center;
    justify-content:center;
}

.name-background{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            rgba(0,0,0,.30),
            rgba(0,0,0,.55)
        );

    z-index:1;
}


/* =====================================================
   FRONT BUS
===================================================== */

.front-bus-container{
    position:absolute;

    left:50%;
    bottom:-3%;

    transform:translateX(-50%);

    width:min(96vw,720px);

    z-index:3;

    transition:
        transform
        1.5s
        cubic-bezier(.65,0,.85,.35);
}

.front-bus{
    display:block;

    width:100%;
    height:auto;

    object-fit:contain;

    filter:
        drop-shadow(
            0 15px 25px
            rgba(0,0,0,.65)
        );
}


/* =====================================================
   NAME INPUT ON THE BLACK GLASS
===================================================== */

.name-interface{
    position:absolute;

    top:25%;
    left:50%;

    transform:translateX(-50%);

    width:min(62vw,430px);

    z-index:6;

    display:flex;
    flex-direction:column;

    align-items:center;
    gap:12px;
}

.enter-title{
    color:#ffd21a;

    font-size:
        clamp(17px,4vw,28px);

    font-weight:900;

    text-align:center;

    text-shadow:
        0 2px 8px #000;
}

.name-input{

    width:100%;

    padding:13px 15px;

    border-radius:12px;

    border:2px solid #ffd21a;

    outline:none;

    background:#020204;

    color:white;

    text-align:center;

    font-size:20px;

    font-weight:bold;

    box-shadow:
        0 0 12px
        rgba(255,210,26,.12);
}

.name-input::placeholder{
    color:#858585;
}

.go-button{

    min-width:105px;

    padding:11px 28px;

    border:none;

    border-radius:12px;

    background:#ffd21a;

    color:#17120a;

    font-size:18px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 4px 0 #967800;
}

.go-button:active{
    transform:translateY(3px);

    box-shadow:
        0 1px 0 #967800;
}


/* =====================================================
   SIDE BUS
===================================================== */

.side-bus-container{

    position:absolute;

    left:-110%;

    top:50%;

    transform:
        translateY(-50%);

    width:
        min(100vw,1100px);

    z-index:5;

    transition:
        left
        1.7s
        cubic-bezier(.65,0,.85,.35);
}

.side-bus{

    width:100%;
    height:auto;

    display:block;

    object-fit:contain;
}


/* =====================================================
   TRANSITION SMOKE
===================================================== */

.smoke{

    position:absolute;

    inset:-10%;

    z-index:10;

    pointer-events:none;

    opacity:0;

    background:
        radial-gradient(
            circle at center,
            rgba(170,170,175,.96) 0%,
            rgba(130,130,135,.94) 35%,
            rgba(70,70,75,.96) 72%,
            rgba(35,35,40,.98) 100%
        );

    transform:scale(.8);
}

.smoke.active{

    animation:
        smokeTransition
        3.5s
        ease-in-out
        forwards;
}

@keyframes smokeTransition{

    0%{
        opacity:0;
        transform:scale(.8);
    }

    25%{
        opacity:1;
        transform:scale(1.1);
    }

    58%{
        opacity:1;
        transform:scale(1.2);
    }

    100%{
        opacity:0;
        transform:scale(1.35);
    }

}


/* =====================================================
   ROOM SCREEN
===================================================== */

#roomScreen{
    align-items:center;
    justify-content:center;
}

.room-content{

    position:relative;

    z-index:4;

    width:min(92vw,520px);

    padding:25px 20px;

    border-radius:25px;

    background:
        rgba(8,7,12,.78);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.55);

    backdrop-filter:
        blur(14px);

    text-align:center;
}

.small-logo{

    width:110px;
    height:110px;

    object-fit:contain;

    margin-bottom:5px;
}

.room-title{

    color:white;

    font-size:30px;

    font-weight:900;

    margin-bottom:8px;
}

.room-subtitle{

    color:#aaa5b0;

    font-size:15px;

    margin-bottom:22px;
}

.room-buttons{

    display:flex;

    flex-direction:column;

    gap:13px;
}

.room-button{

    width:100%;

    min-height:58px;

    border-radius:15px;

    border:1px solid
        rgba(255,210,26,.55);

    background:
        linear-gradient(
            180deg,
            #ffdb32,
            #d7aa00
        );

    color:#17120a;

    font-size:18px;

    font-weight:900;

    cursor:pointer;
}

.room-button.join{

    background:
        rgba(255,255,255,.06);

    color:white;

    border-color:
        rgba(255,255,255,.16);
}

.room-button:active{

    transform:scale(.98);
}


/* =====================================================
   ROOM CODE
===================================================== */

.room-code{

    display:none;

    margin-top:18px;

    padding:15px;

    border-radius:15px;

    border:
        1px dashed
        #ffd21a;

    background:#050509;

    color:#aaa;
}

.room-code.show{
    display:block;
}

.room-code-number{

    display:block;

    margin-top:5px;

    color:#ffd21a;

    font-size:32px;

    font-weight:900;

    letter-spacing:8px;
}


/* =====================================================
   INSIDE BUS PREVIEW
===================================================== */

.inside-bus-preview{

    position:absolute;

    inset:0;

    z-index:0;

    opacity:0;

    transition:
        opacity
        1s
        ease;
}

.inside-bus-preview.show{
    opacity:1;
}

.inside-bus-image{

    width:100%;
    height:100%;

    object-fit:cover;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:600px){

    .front-bus-container{
        width:112vw;
        bottom:1%;
    }

    .name-interface{
        top:26%;
        width:64vw;
    }

    .side-bus-container{
        width:120vw;
    }

}

@media(
    orientation:landscape
) and (
    max-height:600px
){

    .front-bus-container{
        width:75vh;
        max-width:650px;
    }

    .name-interface{
        top:18%;
        width:330px;
    }

    .room-content{
        max-height:90vh;
        overflow:auto;
    }

}

</style>
</head>


<body>

<div class="game">


<!-- ===================================================
     SCREEN 1
     LOGO
=================================================== -->

<section
    id="logoScreen"
    class="screen active">

    <!-- الخلفية المتدرجة -->
    <img
        class="background"
        src="assets/background.jpg"
        alt=""
    >

    <div
        class="background-dark">
    </div>

    <!-- اللوجو فقط -->
    <div class="logo-holder">

        <img
            class="logo"
            src="assets/logo.png"
            alt="Triple V"
        >

    </div>

</section>



<!-- ===================================================
     SCREEN 2
     ENTER NAME
=================================================== -->

<section
    id="nameScreen"
    class="screen">

    <!-- الخلفية -->
    <img
        class="background"
        src="assets/background.jpg"
        alt=""
    >

    <div
        class="name-background">
    </div>


    <!-- صورة داخل الباص -->
    <div
        id="insideBus"
        class="inside-bus-preview">

        <img
            class="inside-bus-image"
            src="assets/bus-inside.jpg"
            alt=""
        >

    </div>


    <!-- الباص الأمامي -->
    <div
        id="frontBus"
        class="front-bus-container">

        <img
            class="front-bus"
            src="assets/bus-front.jpg"
            alt="Bus"
        >


        <!-- الكتابة فوق الزجاج الأسود -->
        <div
            class="name-interface">

            <div
                class="enter-title">

                ENTER THE NAME

            </div>


            <input
                id="nameInput"
                class="name-input"
                type="text"
                maxlength="20"
                autocomplete="name"
                placeholder="Tap here to type"
            >


            <button
                id="goButton"
                class="go-button">

                GO

            </button>

        </div>

    </div>


    <!-- الباص الجانبي -->
    <div
        id="sideBus"
        class="side-bus-container">

        <img
            class="side-bus"
            src="assets/bus-side.jpg"
            alt="Bus"
        >

    </div>


    <!-- الدخان -->
    <div
        id="smoke"
        class="smoke">
    </div>

</section>



<!-- ===================================================
     SCREEN 3
     CREATE / JOIN ROOM
=================================================== -->

<section
    id="roomScreen"
    class="screen">

    <img
        class="background"
        src="assets/background.jpg"
        alt=""
    >

    <div
        class="background-dark">
    </div>


    <div
        class="room-content">

        <!-- اللوجو -->
        <img
            class="small-logo"
            src="assets/logo.png"
            alt="Triple V"
        >


        <div
            class="room-title">

            BUS STOP

        </div>


        <div
            id="welcomeText"
            class="room-subtitle">

            Create a room to start.

        </div>


        <div
            class="room-buttons">

            <button
                id="createRoom"
                class="room-button">

                CREATE ROOM

            </button>


            <button
                id="joinRoom"
                class="room-button join">

                JOIN ROOM

            </button>

        </div>


        <!-- كود الغرفة -->
        <div
            id="roomCode"
            class="room-code">

            ROOM CODE

            <span
                id="roomCodeNumber"
                class="room-code-number">

                -----

            </span>

        </div>

    </div>

</section>


</div>



<script>

/* =====================================================
   ELEMENTS
===================================================== */

const logoScreen =
    document.getElementById("logoScreen");

const nameScreen =
    document.getElementById("nameScreen");

const roomScreen =
    document.getElementById("roomScreen");

const nameInput =
    document.getElementById("nameInput");

const goButton =
    document.getElementById("goButton");

const frontBus =
    document.getElementById("frontBus");

const sideBus =
    document.getElementById("sideBus");

const smoke =
    document.getElementById("smoke");

const insideBus =
    document.getElementById("insideBus");

const welcomeText =
    document.getElementById("welcomeText");

const createRoom =
    document.getElementById("createRoom");

const joinRoom =
    document.getElementById("joinRoom");

const roomCode =
    document.getElementById("roomCode");

const roomCodeNumber =
    document.getElementById("roomCodeNumber");


/* =====================================================
   SCREEN FUNCTION
===================================================== */

function showScreen(screen){

    document
        .querySelectorAll(".screen")
        .forEach(function(item){

            item.classList.remove("active");

        });

    screen.classList.add("active");
}


/* =====================================================
   PRELOAD ALL FIVE IMAGES
===================================================== */

const images = [

    "assets/logo.png",

    "assets/bus-front.jpg",

    "assets/bus-inside.jpg",

    "assets/bus-side.jpg",

    "assets/background.jpg"

];

images.forEach(function(src){

    const img =
        new Image();

    img.src = src;

});


/* =====================================================
   LOGO = 3 SECONDS
===================================================== */

setTimeout(function(){

    showScreen(nameScreen);

},3000);


/* =====================================================
   NAME INPUT
===================================================== */

nameInput.addEventListener(
    "focus",
    function(){

        /*
          على الموبايل:
          أول ما الشخص يضغط على المربع
          الكيبورد الأصلي للموبايل يفتح.
        */

    }
);


/* =====================================================
   GO BUTTON
===================================================== */

goButton.addEventListener(
    "click",
    function(){

        const playerName =
            nameInput.value.trim();


        if(playerName === ""){

            nameInput.focus();

            nameInput.placeholder =
                "Type your name first";

            return;

        }


        /*
          حفظ الاسم
        */

        localStorage.setItem(
            "busStopPlayerName",
            playerName
        );


        goButton.disabled = true;


        /*
          نخفي واجهة الاسم
        */

        document
            .querySelector(".name-interface")
            .style.opacity = "0";


        /*
          الباص الأمامي يتحرك
        */

        frontBus.style.transform =
            "translateX(130vw)";


        /*
          نُظهر الباص الجانبي
          أثناء الانتقال
        */

        setTimeout(function(){

            sideBus.style.left =
                "50%";

            sideBus.style.transform =
                "translate(-50%,-50%)";

        },250);


        /*
          الدخان
        */

        setTimeout(function(){

            smoke.classList.add("active");

        },700);


        /*
          بعد انتهاء الانتقال
          نذهب للغرف
        */

        setTimeout(function(){

            showScreen(roomScreen);

            welcomeText.textContent =
                "Welcome, " +
                playerName +
                ".";

        },3900);

    }
);


/* =====================================================
   CREATE ROOM
===================================================== */

createRoom.addEventListener(
    "click",
    function(){

        const characters =
            "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

        let code = "";

        for(
            let i = 0;
            i < 5;
            i++
        ){

            code +=
                characters[
                    Math.floor(
                        Math.random() *
                        characters.length
                    )
                ];

        }


        roomCodeNumber.textContent =
            code;

        roomCode.classList.add("show");

    }
);


/* =====================================================
   JOIN ROOM
===================================================== */

joinRoom.addEventListener(
    "click",
    function(){

        alert(
            "JOIN ROOM will be connected in the next stage."
        );

    }
);

</script>

</body>
</html>
